# configs/renut_banjo_resolution.toml: renut.toml with one change for you to judge: banjo-nx's resolutions: the 3D at 648 lines handheld, 864 docked (the HUD at 1080), dynamic resolution; the 3D scaled up before the HUD (untested on NiGHTS). Copy over renut.toml to try it.
# NiGHTS into Dreams... (nights-nx) settings, read at start. Everything else is built into nights-nx.nro; a setting
# written here (or a file of configs/ copied over this one) overrides the built-in one.

# Language: auto (the Switch's language), english, japanese, french, german, spanish or italian.
language = "auto"

# SMAA edge smoothing on the 3D (the HUD and text stay sharp). false = the game's own edges.
banjo_renut_smaa = true

# 60 frames a second on the screen with the game at its own 30: in-between frames made from the game's (the camera,
# objects and characters move at 60; particles, sprites and the movies stay at 30). Off by default.
# nights_present_60_mode: 0 = predict (the next half frame guessed: no added input lag), 1 = interpolate (halfway
# between two of the game's frames: nothing overshoots, 16.7 ms more input lag). With it on, double buffering is off.
nights_present_60 = false
nights_present_60_mode = 0

# Face buttons by position, as on an Xbox pad (bottom = A). false = by letter.
input_xbox_layout = true

# Single Joy-Cons are held sideways, one per player.
input_joycon_sideways = true

# With input_joycon_sideways: the single Joy-Con's stick turned for the sideways grip.
input_joycon_sideways_stick = true

# Button mapping: the Switch buttons that press each Xbox button. Empty = default.
# Buttons: A B X Y L R ZL ZR PLUS MINUS LSTICK RSTICK UP DOWN LEFT RIGHT SL SR NONE. Example: a = "B, ZR"

banjo_renut_render_height_handheld = 648
banjo_renut_render_height_docked = 864
banjo_renut_dynamic_resolution = true
[input_p1]
a = ""
b = ""
x = ""
y = ""
lb = ""
