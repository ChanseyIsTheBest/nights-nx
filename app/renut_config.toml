# nights-nx (NiGHTS into Dreams..., XBLA, title 58411268, XDK 2.0.21173) - ReXGlue codegen configuration.
# Started from banjo-nx's renut_config.toml (2026-10-28). Banjo's per-function lists (share_registers, the
# non_argument_as_local_keep list, the v64-v77 / v92 keep, setjmp at 0x82BB5EF0) are N&B's addresses and were dropped:
# each is re-derived for NiGHTS from its own generated code (docs/nights-notes.md, "Code generation").

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"config/renut_nonarg_keep.toml",
]

# The register-diet set the XDK-2.0.2xxxx ports run (zumasrevenge-nx's perf_overrides.toml; banjo-nx's options with the
# same names, see banjo-nx's renut_config.toml for the reasons and measurements of each): CR / CTR / XER / reservation
# as C++ locals, no MSR fences, D-form displacement split, inline float conversions, the float-mode diet.
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true
# r14-r31 / f14-f31 / v14-v31 / v64-v127 as C++ locals. The keep list is the registers NiGHTS uses outside the ABI
# (found by tools/read_before_write.py on the generated code; see docs/nights-notes.md).
non_volatile_as_local = true
# v64-v72: VMX128 constants of the XDK libraries, read and never written by sub_824DB8B8, sub_824DBEF0, sub_825C1A00,
# sub_825C1DA8, sub_825C2068, sub_825C22D0 (v69, v72) and sub_825C33F8 (v64, v65) (tools/read_before_write.py,
# 2026-10-28); the same range zumasrevenge-nx keeps for its XDK.
non_volatile_as_local_keep = ["v64-v72"]
# elide_lr_stores (banjo-nx's, 2026-10-07): no `ctx.lr = <return address>` before every call. ctx.lr is read only by
# diagnostics (the guest unwinder is not implemented, so the saved return addresses are never read back); no NiGHTS
# hook or Renut hook reads ctx.lr (2026-10-29: grep of app/src).
elide_lr_stores = true
# non_argument_as_local (banjo-nx's, from sa2-nx via peggle2-nx; 2026-10-29 here): r0, r2, r11, r12, f0 and v32-v63 as
# C++ locals. The keep list (config/renut_nonarg_keep.toml) is tools/non_argument_audit.py's findings on code generated
# without the option plus every v32-v63 writer; checked after generating with it (--with-option: no HANDOVER).
non_argument_as_local = true

project_name = "renut"
file_path = "assets/default.xex"
out_directory_path = "generated"

