# The CRT's setjmp / longjmp (root keys), found by shape as in zumasrevenge-nx:
#   setjmp  0x825872D0: a hook word at 0x842CA7C0 tried first (bnectr), mflr, mfcr, stfd f14-f31 at 0(r3)...
#   longjmp 0x82586EA0: the check of +312, mr r7,r3, lfd f14-f31 from 0(r7)...
