# Leaf functions reached only by a tail branch (no .pdata entry), "target not in any function" in the first codegen:
#   0x823B9BA0: lwz r3,184(r3); beqlr; tail call through the pointer at 0x827AFA4C (bctr at 0x823B9BB8)
#   0x823B9070: r11 = (r4 != 0); stw r11,172(r3); blr
#   0x823F5310: lwz r3,608(r3); b 0x82401E90
